# =====================================================================
# Roteiro 8 — PIPELINE do Portal de Tarefas (GitHub Actions)
# Cada "job" roda numa máquina nova do GitHub. "needs" define a ordem:
#   api ─┐
#        ├─▶ publicar ─▶ implantar (Etapa 4)
#   frontend ─┘
# Se QUALQUER teste falhar, os jobs seguintes nem começam.
# =====================================================================
name: CI/CD

# GATILHOS: todo pull request para a main e todo push na main
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ---------- Verificação da API: restore, build e testes ----------
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'          # versão do SDK EXPLÍCITA
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release -p:OpenApiGenerateDocuments=false
      - run: dotnet test --no-build -c Release

  # ---------- Verificação do front-end: npm ci, testes e build ----------
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PortalTarefas.Frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci                         # instala EXATAMENTE o que está no package-lock.json
      - run: npm test
      - run: npm run build

  # ---------- Publicação dos artefatos: SÓ depois das duas verificações ----------
  publicar:
    needs: [api, frontend]
    if: github.event_name == 'push'          # em pull request, só verifica; publica só na main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: dotnet publish PortalTarefas.Web -c Release -o saida/api -p:OpenApiGenerateDocuments=false
      - run: npm ci && npm run build
        working-directory: PortalTarefas.Frontend
      - run: cp -r PortalTarefas.Frontend/dist saida/frontend
      - uses: actions/upload-artifact@v4
        with:
          name: portaltarefas-${{ github.sha }}   # o artefato leva o commit no nome
          path: saida/
            # ---------- CD: imagem com a tag do commit, ambiente de teste e smoke test ----------
  implantar:
    needs: publicar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                        # permite publicar no GitHub Container Registry
    steps:
      - uses: actions/checkout@v6

      - name: Nome da imagem (registro + repositório + commit)
        run: echo "IMAGEM=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Construir a imagem
        run: docker build --build-arg VERSAO=$GITHUB_SHA -t $IMAGEM .

      - name: Implantar no ambiente de teste (um contêiner nesta máquina)
        run: |
          docker run -d --name teste -p 8080:8080 \
            -e ConnectionStrings__PortalTarefasDb="Data Source=/app/data/portaltarefas.db" \
            -e Externo__BaseUrl="http://localhost:8080/" \
            -e Banco__AplicarMigrations=true \
            $IMAGEM

      - name: Health Check e smoke test
        run: |
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:8080/health/ready
          curl --fail http://localhost:8080/api/tarefas
          curl --fail http://localhost:8080/api/diagnostico | grep $GITHUB_SHA

      - name: Usuário e conteúdo da imagem (sem segredos)
        run: |
          docker exec teste whoami
          docker run --rm --entrypoint ls $IMAGEM -a /app

      - name: Publicar a imagem (só se o smoke test passou)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push $IMAGEM